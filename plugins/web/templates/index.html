<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cordi v2 Dashboard</title>
    <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
    <div class="app">
        <header class="app-header">
            <div class="header-brand">
                <div class="logo">CK</div>
                <div class="brand-text">
                    <h1>Continuity Kernel</h1>
                    <span class="subtitle">Cordi v2</span>
                </div>
            </div>
            <div class="header-actions">
                <span id="connection-status" class="badge">connecting</span>
                <span id="active-session" class="badge">no session</span>
                <button id="settings-toggle" class="icon-btn" title="Settings">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
                </button>
            </div>
        </header>

        <div class="settings-panel" id="settings-panel">
            <div class="settings-content">
                <h3>Settings</h3>
                <label class="setting-item">
                    <span>Auto-scroll</span>
                    <input type="checkbox" id="setting-autoscroll" checked>
                </label>
                <label class="setting-item">
                    <span>Show timestamps</span>
                    <input type="checkbox" id="setting-timestamps" checked>
                </label>
                <label class="setting-item">
                    <span>Compact mode</span>
                    <input type="checkbox" id="setting-compact">
                </label>
                <div class="setting-item">
                    <span>Model</span>
                    <select id="setting-model">
                        <option value="default">Default</option>
                    </select>
                </div>
            </div>
        </div>

        <main class="app-main">
            <aside class="sidebar">
                <section class="panel">
                    <div class="panel-header">
                        <h2>Sessions</h2>
                        <button id="new-session" class="icon-btn" title="New session">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                        </button>
                    </div>
                    <div id="session-list" class="session-list">
                        <div class="empty">Loading sessions…</div>
                    </div>
                    <button id="refresh-sessions" class="secondary full-width">Refresh</button>
                </section>
                <section class="panel">
                    <div class="panel-header">
                        <h2>Models</h2>
                    </div>
                    <div id="model-list" class="model-list">
                        <div class="empty">Loading models…</div>
                    </div>
                </section>
                <section class="panel">
                    <div class="panel-header">
                        <h2>Metrics</h2>
                        <button id="refresh-metrics" class="icon-btn" title="Refresh metrics">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"></polyline><polyline points="1 20 1 14 7 14"></polyline><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path></svg>
                        </button>
                    </div>
                    <pre id="metrics" class="metrics">Loading…</pre>
                </section>
            </aside>
            <section class="chat">
                <div id="chat-messages" class="chat-messages">
                    <div class="empty-state">
                        <div class="empty-icon">
                            <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
                        </div>
                        <p>Select or create a session to begin.</p>
                    </div>
                </div>
                <div id="typing-indicator" class="typing-indicator hidden">
                    <span class="dot"></span>
                    <span class="dot"></span>
                    <span class="dot"></span>
                </div>
                <form id="chat-form" class="chat-form">
                    <div class="input-wrap">
                        <input id="chat-input" type="text" placeholder="Send a message…" autocomplete="off" />
                        <button type="submit" class="send-btn" title="Send">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
                        </button>
                    </div>
                </form>
            </section>
        </main>
    </div>
    <script src="/static/app.js"></script>
</body>
</html>
